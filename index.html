<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Parque Científico Interactivo</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>

<body>

<div id="hud">
    <b>🌟 Misión del Parque Científico 🌟</b><br>
    1. Clic en el Gato 🐈<br>
    2. Clic en el Auto 🚗<br>
    3. Clic en el Zorro 🦊<br>
    4. ¡Explora los 8 árboles! 🌳<br><br>
    <span style="font-size:11px; color:#ccc;">← ↑ ↓ → Auto &nbsp;·&nbsp; W A S D Cámara</span><br><br>
    <button id="resetBtn" onclick="resetGame()">Volver al Inicio</button>
</div>

<div id="panel-educativo">
    <h3 id="panel-titulo">Título</h3>
    <p id="panel-texto">Descripción...</p>
</div>

<!-- Audios -->
<audio id="meow-audio" src="./models/cat_sound.mp3" preload="auto"></audio>
<audio id="bg-audio" src="./models/pasos_sound.mp3" loop></audio>

<a-scene shadow="type: pcfsoft" renderer="antialias: true" cursor="rayOrigin: mouse">

    <a-assets>
        <a-asset-item id="arbol1" src="./models/arbol1.glb"></a-asset-item>
        <a-asset-item id="arbol2" src="./models/arbol2.glb"></a-asset-item>
        <a-asset-item id="arbol3" src="./models/arbol3.glb"></a-asset-item>
        <a-asset-item id="arbol4" src="./models/arbol4.glb"></a-asset-item>
        <a-asset-item id="arbol5" src="./models/arbol5.glb"></a-asset-item>
        <a-asset-item id="casa" src="./models/casas.glb"></a-asset-item>
        <a-asset-item id="auto" src="./models/auto.glb"></a-asset-item>
        <a-asset-item id="gato" src="./models/gato.glb"></a-asset-item>
        <a-asset-item id="persona" src="./models/persona_caminando.glb"></a-asset-item>
        <a-asset-item id="fox" src="./models/fox.glb"></a-asset-item>
    </a-assets>

    <a-sky color="#87CEEB"></a-sky>

    <a-entity id="camera" camera look-controls position="0 0.1 17"></a-entity>

    <a-light type="ambient" intensity="1"></a-light>
    <a-light type="directional" intensity="2" position="10 20 10" castShadow="true"></a-light>

    <a-plane rotation="-90 0 0" color="#4CAF50" width="30" height="30"></a-plane>
    <a-plane rotation="-90 0 0" color="#808080" width="6" height="28" position="0 0.01 0"></a-plane>

    <!-- ===================== CASAS ===================== -->
    <a-entity id="casa-wrapper" position="7 0 35" rotation="0 -180 0">
        <a-box id="casa-edu" class="clickable" material="color: red; transparent: true; opacity: 0.0" width="5" height="5" depth="5" position="0 2.5 0"></a-box>
        <a-entity gltf-model="#casa" scale="0.8 0.8 0.8"></a-entity>
    </a-entity>
    <a-entity gltf-model="#casa" scale="0.8 0.8 0.8" position="-7 0 -37" rotation="0 0 0"></a-entity>

    <!-- ===================== AUTO (Con Hitbox) ===================== -->
    <a-entity id="car" class="clickable" position="0 0 2">
        <a-box material="color: red; transparent: true; opacity: 0.0" width="2" height="1.5" depth="3" position="0 0.7 0"></a-box>
        <a-entity gltf-model="#auto"></a-entity>
    </a-entity>

    <!-- ===================== GATO (Con Hitbox) ===================== -->
    <a-entity id="cat" class="clickable" position="-7 0.1 10">
        <a-cylinder material="color: red; transparent: true; opacity: 0.0" radius="0.8" height="1.5" position="0 0.5 0"></a-cylinder>
        <a-entity gltf-model="#gato" scale="0.015 0.015 0.015" rotation="0 90 0"></a-entity>
    </a-entity>

    <!-- ===================== ZORRO (Rotación en el contenedor y más al centro) ===================== -->
    <a-entity id="fox-edu" class="clickable" position="4 0 13.5" rotation="0 -90 0" fox-walk="speed: 1; limit: 14">
        <a-box material="color: red; transparent: true; opacity: 0.0" width="1.5" height="1.5" depth="2" position="0 0.7 0"></a-box>
        <!-- El modelo ya no tiene la rotación, ahora gira todo el contenedor -->
        <a-entity gltf-model="#fox" scale="0.01 0.01 0.01" animation-mixer="clip: *; loop: repeat; timeScale: 1"></a-entity>
    </a-entity>

    <!-- ===================== PERSONA (El Hitbox se mueve con ella) ===================== -->
    <a-entity id="caminante" class="clickable" position="-2 -0.01 -4" walk-path="speed: 1; limit: 14; bobHeight: 0.08; swayAngle: 3">
        <a-cylinder material="color: red; transparent: true; opacity: 0.0" radius="0.5" height="2" position="0 1 0"></a-cylinder>
        <a-entity gltf-model="#persona" scale="0.6 0.6 0.6"></a-entity>
    </a-entity>

    <!-- ===================== ÁRBOLES EDUCATIVOS ===================== -->
    
    <!-- Árbol 1: CO2 -->
    <a-entity id="arbol-edu" class="clickable" position="-8 0 9">
        <a-cylinder material="color: red; transparent: true; opacity: 0.0" radius="2" height="6" position="0 3 0"></a-cylinder>
        <a-entity gltf-model="#arbol2" scale="0.5 0.5 0.5" rotation="0 270 0"></a-entity>
    </a-entity>

    <!-- Árbol 2: Clorofila -->
    <a-entity id="arbol-amarillo-edu" class="clickable" position=" 11 -1 10">
        <a-cylinder material="color: red; transparent: true; opacity: 0.0" radius="1.5" height="5" position="0 2.5 0"></a-cylinder>
        <a-entity gltf-model="#arbol5" scale="0.04 0.04 0.04" rotation="0 -75 0" wind-sway="intensity: 1; speed: 1.5"></a-entity>
    </a-entity>
    
    <!-- Árbol 3: Agua -->
    <a-entity id="arbol-agua-edu" class="clickable" position=" 7 -1 -10">
        <a-cylinder material="color: red; transparent: true; opacity: 0.0" radius="1.5" height="5" position="0 2.5 0"></a-cylinder>
        <a-entity gltf-model="#arbol5" scale="0.04 0.04 0.04" rotation="0 15 0" wind-sway="intensity: 1; speed: 1.5"></a-entity>
    </a-entity>
    
    <!-- Árbol 4: Historia -->
    <a-entity id="arbol-historia-edu" class="clickable" position=" -10 -1 -10">
        <a-cylinder material="color: red; transparent: true; opacity: 0.0" radius="1.5" height="5" position="0 2.5 0"></a-cylinder>
        <a-entity gltf-model="#arbol5" scale="0.04 0.04 0.04" rotation="0 120 0" wind-sway="intensity: 1; speed: 1.5"></a-entity>
    </a-entity>

    <!-- Árbol 5: Aire -->
    <a-entity id="arbol-aire-edu" class="clickable" position="4 0.1 3">
        <a-cylinder material="color: red; transparent: true; opacity: 0.0" radius="1" height="4" position="0 2 0"></a-cylinder>
        <a-entity gltf-model="#arbol4" scale="0.005 0.005 0.005" rotation="0 45 0" wind-sway="intensity: 1; speed: 1.5"></a-entity>
    </a-entity>
    
    <!-- Árbol 6: Comunicación -->
    <a-entity id="arbol-red-edu" class="clickable" position=" -6 0.1 -14">
        <a-cylinder material="color: red; transparent: true; opacity: 0.0" radius="1" height="4" position="0 2 0"></a-cylinder>
        <a-entity gltf-model="#arbol4" scale="0.005 0.005 0.005" rotation="0 -30 0" wind-sway="intensity: 1; speed: 1.5"></a-entity>
    </a-entity>
    
    <!-- Árbol 7: Oxígeno -->
    <a-entity id="arbol-oxigeno-edu" class="clickable" position="-4 0.1 0">
        <a-cylinder material="color: red; transparent: true; opacity: 0.0" radius="1" height="4" position="0 2 0"></a-cylinder>
        <a-entity gltf-model="#arbol4" scale="0.005 0.005 0.005" rotation="0 90 0" wind-sway="intensity: 1; speed: 1.5"></a-entity>
    </a-entity>

    <!-- Árbol 8: Erosión -->
    <a-entity id="arbol-erosion-edu" class="clickable" position=" 6 0.1 13">
        <a-cylinder material="color: red; transparent: true; opacity: 0.0" radius="1" height="4" position="0 2 0"></a-cylinder>
        <a-entity gltf-model="#arbol4" scale="0.005 0.005 0.005" rotation="0 120 0" wind-sway="intensity: 1; speed: 1.5"></a-entity>
    </a-entity>

</a-scene>

</body>
</html>
